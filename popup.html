<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Udemy Dual Subtitles</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1 data-i18n="title"></h1>
      <label class="switch" data-i18n-title="toggle">
        <input type="checkbox" id="enabled" />
        <span></span>
      </label>
    </header>

    <section>
      <label class="row">
        <span data-i18n="primary"></span>
        <select id="primary"></select>
      </label>
      <label class="row">
        <span data-i18n="size"></span>
        <input type="range" id="primarySize" min="60" max="160" step="5" />
        <output id="primarySizeOut"></output>
      </label>
    </section>

    <section>
      <label class="row">
        <span data-i18n="secondary"></span>
        <select id="secondary"></select>
      </label>
      <label class="row">
        <span data-i18n="size"></span>
        <input type="range" id="secondarySize" min="40" max="140" step="5" />
        <output id="secondarySizeOut"></output>
      </label>
    </section>

    <section>
      <label class="row">
        <span data-i18n="margin"></span>
        <input type="range" id="margin" min="0" max="20" step="1" />
        <output id="marginOut"></output>
      </label>
      <label class="check">
        <input type="checkbox" id="hideNative" />
        <span data-i18n="hideNative"></span>
      </label>
      <label class="check">
        <input type="checkbox" id="translateFallback" />
        <span data-i18n="translateFallback"></span>
      </label>
    </section>

    <section class="meta">
      <label class="row">
        <span data-i18n="uiLanguage"></span>
        <select id="uiLanguage"></select>
      </label>
      <button type="button" id="reset" data-i18n="reset"></button>
    </section>

    <footer>
      <p id="status"></p>
      <p class="privacy" data-i18n="privacy"></p>
    </footer>

    <script src="core.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
