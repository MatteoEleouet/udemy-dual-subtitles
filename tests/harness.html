<!doctype html>
<!--
  Visual check of the overlay without Udemy: a playing <video>, a fake Udemy
  API and CDN, and the real core.js + content.js + content.css.

  Serve the extension folder (e.g. `python -m http.server 8765`) and open
  http://localhost:8765/tests/harness.html
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Dual subtitles — harness</title>
    <link rel="stylesheet" href="/content.css" />
    <style>
      body { margin: 0; background: #1c1d1f; font-family: system-ui; color: #ccc; }
      .player { position: relative; width: 860px; aspect-ratio: 16 / 9; margin: 24px auto; background: #000; }
      .player video { width: 100%; height: 100%; display: block; }
      /* What Udemy's own captions look like in the DOM, to check they are hidden. */
      .native { position: absolute; bottom: 30%; width: 100%; text-align: center; color: red; font-size: 20px; }
      p { text-align: center; }
    </style>
  </head>
  <body>
    <div class="player">
      <video muted playsinline></video>
      <div class="native" data-purpose="captions-cue-text">NATIVE UDEMY CAPTION (should be hidden)</div>
    </div>
    <p id="clock"></p>

    <script>
      // The lecture URL the content script reads its lecture id from.
      history.replaceState(null, '', '/course/demo-course/learn/lecture/4242');

      const EN = `WEBVTT

00:00:00.200 --> 00:00:03.000
Hello and welcome to this lecture on prime factorization.

00:00:03.000 --> 00:00:06.000
Every whole number can be written as a product of primes.

00:00:06.000 --> 00:00:30.000
For example, twelve is two times two times three.`;

      const FR = `WEBVTT

00:00:00.200 --> 00:00:03.000
Bonjour et bienvenue dans ce cours sur la décomposition en facteurs premiers.

00:00:03.000 --> 00:00:06.000
Tout nombre entier s'écrit comme un produit de nombres premiers.

00:00:06.000 --> 00:00:30.000
Par exemple, douze vaut deux fois deux fois trois.`;

      // Fake Udemy API, answering the two requests the content script makes.
      document.body.dataset.clpCourseId = '99';
      window.fetch = async (url) => {
        const path = String(url);
        if (path.includes('/lectures/4242/')) {
          return new Response(
            JSON.stringify({
              asset: {
                captions: [
                  { locale_id: 'en_US', video_label: 'English', source: 'manual', url: 'https://vtt-c.udemycdn.com/en.vtt' },
                  { locale_id: 'fr_FR', video_label: 'French [Auto]', source: 'auto', url: 'https://vtt-c.udemycdn.com/fr.vtt' },
                ],
              },
            }),
          );
        }
        return new Response('{}', { status: 404 });
      };

      // Fake chrome.* — storage with the defaults, and the worker's VTT fetch.
      const listeners = [];
      window.chrome = {
        storage: {
          sync: { get: (defaults, cb) => cb({ ...defaults }) },
          onChanged: { addListener: (fn) => listeners.push(fn) },
        },
        runtime: {
          sendMessage: async (message) => ({ ok: true, text: message.url.endsWith('fr.vtt') ? FR : EN }),
          onMessage: { addListener: () => {} },
        },
      };
      window.setSetting = (key, value) =>
        listeners.forEach((fn) => fn({ [key]: { newValue: value } }, 'sync'));

      // A video that actually plays: a canvas stream, so currentTime advances.
      const canvas = Object.assign(document.createElement('canvas'), { width: 640, height: 360 });
      const ctx = canvas.getContext('2d');
      const video = document.querySelector('video');
      video.srcObject = canvas.captureStream(30);
      (function paint() {
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 0, 640, 360);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '28px system-ui';
        ctx.fillText('12 = 2 × 2 × 3', 230, 170);
        document.getElementById('clock').textContent = `t = ${video.currentTime.toFixed(1)} s`;
        requestAnimationFrame(paint);
      })();
      video.play();
    </script>
    <script src="/core.js"></script>
    <script src="/content.js"></script>
  </body>
</html>
