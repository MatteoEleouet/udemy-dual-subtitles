name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Syntax, tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies to install: the extension ships as plain files.
      - run: npm run check
      - run: npm test
      - run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip
